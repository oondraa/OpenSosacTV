[package]
name = "opensosactv"
version = "0.2.0"
edition = "2024"
description = "OpenSosacTV pro Windows"
license = "GPL-2.0-only"

[[bin]]
name = "OpenSosacTV"
path = "src/main.rs"

[dependencies]
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
dirs = "7.0.0"
eframe = "0.35.0"
egui_extras = { version = "0.35.0", features = ["image", "http"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
md-5 = "0.10.6"
raw-window-handle = "0.6.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2.5.4"
wry = "0.57.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
