<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenSosacTV" />
    <meta name="application-name" content="OpenSosacTV" />
    <meta name="description" content="OpenSosacTV: neoficiální klient pro Sosáč a Streamuj.tv." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>OpenSosacTV</title>
    <style>
      /* Úvodní obrazovka. Inline, aby naskočila dřív než JS. Skrývá ji src/ui/splash.ts. */
      html, body { background: #050505; margin: 0; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(60vmax 60vmax at 50% 45%, rgba(255, 90, 54, 0.14), rgba(5, 5, 5, 0) 60%), #050505;
        color: #f5f5f7;
        font-family: 'Geist Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 600ms cubic-bezier(0.32, 0.72, 0, 1), transform 900ms cubic-bezier(0.32, 0.72, 0, 1), filter 600ms;
      }
      #splash.is-done { opacity: 0; transform: scale(1.06); filter: blur(6px); pointer-events: none; }
      .splash__inner { display: grid; justify-items: center; gap: 1.6rem; }
      .splash__mark { width: clamp(88px, 14vmin, 150px); height: auto; overflow: visible; }
      .splash__glow { transform-origin: 32px 32px; animation: splashGlow 2.4s cubic-bezier(0.37, 0, 0.63, 1) 900ms infinite; opacity: 0; }
      .splash__ring {
        stroke-dasharray: 117 300;
        stroke-dashoffset: 117;
        animation: splashDraw 1100ms cubic-bezier(0.65, 0, 0.35, 1) 120ms forwards;
      }
      .splash__play { transform-origin: 34px 32px; transform: scale(0.2); opacity: 0; animation: splashPop 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 650ms forwards; }
      .splash__word { display: flex; align-items: baseline; gap: 0.12em; font-size: clamp(26px, 4.2vmin, 44px); letter-spacing: -0.03em; overflow: hidden; padding: 0.1em 0; }
      .splash__word span { display: inline-block; transform: translateY(110%); animation: splashRise 800ms cubic-bezier(0.32, 0.72, 0, 1) forwards; }
      .splash__word .o { font-weight: 400; color: rgba(235, 235, 245, 0.64); animation-delay: 750ms; }
      .splash__word .s { font-weight: 700; animation-delay: 830ms; }
      .splash__word .t {
        align-self: center;
        margin-left: 0.18em;
        padding: 0.18em 0.42em;
        border-radius: 0.32em;
        font-size: 0.5em;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #fff;
        background: linear-gradient(135deg, #ffb347, #ff5a36 50%, #e0245e);
        animation-delay: 910ms;
      }
      .splash__bar { width: clamp(120px, 18vmin, 180px); height: 2px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden; opacity: 0; animation: splashFade 400ms ease-out 1100ms forwards; }
      .splash__bar i { display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ffb347, #ff5a36, #e0245e); animation: splashSlide 1200ms cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      @keyframes splashDraw { to { stroke-dashoffset: 0; } }
      @keyframes splashPop { to { transform: scale(1); opacity: 1; } }
      @keyframes splashRise { to { transform: none; } }
      @keyframes splashFade { to { opacity: 1; } }
      @keyframes splashSlide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @keyframes splashGlow { 0%, 100% { opacity: 0; transform: scale(0.9); } 50% { opacity: 0.55; transform: scale(1.15); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Načítám OpenSosacTV">
      <div class="splash__inner">
        <svg class="splash__mark" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="splash-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffb347" />
              <stop offset="0.5" stop-color="#ff5a36" />
              <stop offset="1" stop-color="#e0245e" />
            </linearGradient>
            <radialGradient id="splash-glow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ff5a36" stop-opacity="0.5" />
              <stop offset="1" stop-color="#ff5a36" stop-opacity="0" />
            </radialGradient>
          </defs>
          <circle class="splash__glow" cx="32" cy="32" r="31" fill="url(#splash-glow)" />
          <circle class="splash__ring" cx="32" cy="32" r="22" fill="none" stroke="url(#splash-g)" stroke-width="7" stroke-linecap="round" transform="rotate(-50 32 32)" />
          <path class="splash__play" d="M27.5 22.75 L41.25 32 L27.5 41.25 Z" fill="#fff" stroke="#fff" stroke-width="2.75" stroke-linejoin="round" />
        </svg>
        <div class="splash__word"><span class="o">Open</span><span class="s">Sosac</span><span class="t">TV</span></div>
        <div class="splash__bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
